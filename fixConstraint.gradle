// Script Gradle temporal para corregir el CHECK constraint de facturas
// Ejecutar con: ./gradlew fixFacturasConstraint

buildscript {
    repositories { mavenCentral() }
    dependencies {
        classpath 'org.postgresql:postgresql:42.7.3'
    }
}

task fixFacturasConstraint {
    doLast {
        def url = System.getenv('SPRING_DATASOURCE_URL') ?: 'jdbc:postgresql://localhost:5432/p2_sw2_sprint_boot'
        def user = System.getenv('SPRING_DATASOURCE_USERNAME') ?: 'postgres'
        def pass = System.getenv('SPRING_DATASOURCE_PASSWORD') ?: '12345'

        def sql = """
-- Verificar constraint actual
SELECT pg_get_constraintdef(c.oid) AS constraint_def, c.conname
FROM pg_constraint c
JOIN pg_class t ON c.conrelid = t.oid
WHERE t.relname = 'facturas' AND c.contype = 'c';
"""
        def conn = groovy.sql.Sql.newInstance(url, user, pass, 'org.postgresql.Driver')
        conn.eachRow(sql) { row ->
            println "Constraint: ${row.conname} => ${row.constraint_def}"
        }
        conn.close()
    }
}
